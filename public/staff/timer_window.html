<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Timer — Sportynix Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .brand {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #4ade80;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .card {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            padding: 28px 32px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .booking-info {
            margin-bottom: 20px;
        }

        .player-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }

        .game-name {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .meta {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
        }

        .meta-item {
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .meta-item span {
            display: block;
            font-size: 0.92rem;
            color: #e2e8f0;
            font-weight: 600;
            margin-top: 2px;
        }

        /* Timer Ring */
        .timer-ring-wrap {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
        }

        .timer-ring-wrap svg {
            transform: rotate(-90deg);
        }

        .timer-ring-bg {
            fill: none;
            stroke: rgba(255,255,255,0.1);
            stroke-width: 10;
        }

        .timer-ring-progress {
            fill: none;
            stroke: #4ade80;
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear, stroke 0.5s;
        }

        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .timer-display {
            font-size: 2.6rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            line-height: 1;
        }

        .timer-label {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Status bar */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 1.5s infinite;
        }

        .status-dot.paused { background: #fbbf24; animation: none; }
        .status-dot.ended  { background: #f87171; animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        /* Progress bar */
        .progress-wrap {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            height: 6px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22d3ee);
            border-radius: 8px;
            transition: width 1s linear;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background: #4ade80; color: #0f2027; }
        .btn-primary:hover { background: #22c55e; }
        .btn-danger  { background: #ef4444; color: #fff; }
        .btn-danger:hover  { background: #dc2626; }

        /* Alerts */
        .alert-overtime {
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.4);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 0.85rem;
            color: #fca5a5;
            margin-bottom: 16px;
            display: none;
        }

        .footer {
            margin-top: 16px;
            font-size: 0.72rem;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="brand">Sportynix Hub · Session Timer</div>

<div class="card">
    <div class="booking-info">
        <div class="player-name" id="playerName">Loading...</div>
        <div class="game-name" id="gameName">—</div>
        <div class="meta">
            <div class="meta-item">Start Time <span id="startTime">—</span></div>
            <div class="meta-item">Duration <span id="totalDuration">—</span></div>
            <div class="meta-item">Booking # <span id="bookingId">—</span></div>
        </div>
    </div>

    <div class="timer-ring-wrap">
        <svg width="180" height="180" viewBox="0 0 180 180">
            <circle class="timer-ring-bg" cx="90" cy="90" r="80"/>
            <circle class="timer-ring-progress" id="ringProgress" cx="90" cy="90" r="80"/>
        </svg>
        <div class="timer-text">
            <div class="timer-display" id="timerDisplay">00:00</div>
            <div class="timer-label" id="timerLabel">remaining</div>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Running</span>
    </div>

    <div class="progress-wrap">
        <div class="progress-fill" id="progressFill" style="width:100%"></div>
    </div>

    <div class="alert-overtime" id="overtimeAlert">
        ⚠️ Session time is up! Booking marked as <strong>Played</strong>.
    </div>

    <div class="btn-row">
        <button class="btn btn-primary" id="toggleBtn" onclick="toggleTimer()">Pause</button>
        <button class="btn btn-danger" onclick="window.close()">Close</button>
    </div>
</div>

<div class="footer">Auto-synced with staff dashboard</div>

<script>
    let remaining     = 0;
    let totalDuration = 0;
    let isRunning     = false;
    let interval      = null;
    const CIRCUMFERENCE = 2 * Math.PI * 80; // r=80

    // Called by parent window to initialize
    window.receiveTimerData = function(data) {
        remaining     = data.remaining     ?? 0;
        totalDuration = data.totalDuration ?? remaining;
        isRunning     = data.isRunning     ?? true;

        document.getElementById('playerName').textContent   = data.player        ?? 'Player';
        document.getElementById('gameName').textContent     = data.game          ?? '—';
        document.getElementById('startTime').textContent    = data.startTimeDisplay ?? '—';
        document.getElementById('totalDuration').textContent = formatTime(totalDuration);
        document.getElementById('bookingId').textContent    = '#' + (data.bookingId ?? '—');

        updateDisplay();
        if (isRunning) startInterval();
    };

    function startInterval() {
        clearInterval(interval);
        interval = setInterval(function() {
            if (!isRunning) return;
            remaining = Math.max(0, remaining - 1);
            updateDisplay();
            if (remaining === 0) {
                clearInterval(interval);
                document.getElementById('overtimeAlert').style.display = 'block';
                document.getElementById('statusDot').className = 'status-dot ended';
                document.getElementById('statusText').textContent = 'Time Up';
                document.getElementById('timerLabel').textContent = 'OVER';
                document.getElementById('timerDisplay').style.color = '#f87171';
                document.getElementById('ringProgress').style.stroke = '#f87171';
                document.getElementById('progressFill').style.background = '#ef4444';
                try { new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAA').play(); } catch(e) {}
            }
        }, 1000);
    }

    function updateDisplay() {
        document.getElementById('timerDisplay').textContent = formatTime(remaining);
        const pct = totalDuration > 0 ? remaining / totalDuration : 0;
        const offset = CIRCUMFERENCE * (1 - pct);
        document.getElementById('ringProgress').style.strokeDasharray  = CIRCUMFERENCE;
        document.getElementById('ringProgress').style.strokeDashoffset = offset;
        document.getElementById('progressFill').style.width = (pct * 100) + '%';

        // Color shift: green → yellow → red
        if (pct > 0.5)      document.getElementById('ringProgress').style.stroke = '#4ade80';
        else if (pct > 0.2) document.getElementById('ringProgress').style.stroke = '#fbbf24';
        else                document.getElementById('ringProgress').style.stroke = '#f87171';
    }

    function toggleTimer() {
        isRunning = !isRunning;
        const dot = document.getElementById('statusDot');
        const btn = document.getElementById('toggleBtn');
        if (isRunning) {
            dot.className = 'status-dot';
            document.getElementById('statusText').textContent = 'Running';
            btn.textContent = 'Pause';
            startInterval();
        } else {
            dot.className = 'status-dot paused';
            document.getElementById('statusText').textContent = 'Paused';
            btn.textContent = 'Resume';
            clearInterval(interval);
        }
    }

    function formatTime(seconds) {
        const m = Math.floor(Math.abs(seconds) / 60);
        const s = Math.abs(seconds) % 60;
        return (seconds < 0 ? '-' : '') +
               String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    // Called by parent when booking is marked as played
    window.onTimerComplete = function() {
        document.getElementById('overtimeAlert').style.display = 'block';
        document.getElementById('statusDot').className = 'status-dot ended';
        document.getElementById('statusText').textContent = 'Marked as Played';
        document.getElementById('timerLabel').textContent = 'PLAYED';
        document.getElementById('timerDisplay').style.color = '#4ade80';
        document.getElementById('toggleBtn').disabled = true;
        document.getElementById('toggleBtn').textContent = 'Played ✓';
        document.getElementById('toggleBtn').style.background = '#166534';
        document.title = '✅ Session Complete — Sportynix Hub';
    };

    // If opened directly (not via parent), show placeholder
    if (!window.opener) {
        document.getElementById('playerName').textContent = 'Demo Mode';
        document.getElementById('gameName').textContent   = 'Open from Bookings page';
        remaining = totalDuration = 3600;
        isRunning = true;
        updateDisplay();
        startInterval();
    }
</script>
</body>
</html>
