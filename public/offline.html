<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Sportynix Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f8f9fa;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; text-align: center; padding: 20px;
        }
        .container { max-width: 400px; }
        .icon { font-size: 4rem; margin-bottom: 16px; }
        h1 { font-size: 1.5rem; color: #19722d; margin-bottom: 8px; }
        p  { color: #6c757d; font-size: 0.95rem; margin-bottom: 24px; }
        .btn {
            display: inline-block; padding: 12px 28px;
            background: #19722d; color: #fff; border-radius: 8px;
            text-decoration: none; font-weight: 600;
            border: none; cursor: pointer; font-size: 1rem;
        }
        .btn:hover { background: #145c24; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>No internet connection. Please check your network and try again.</p>
        <button class="btn" onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
